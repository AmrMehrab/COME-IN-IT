services:
 - type: web
   name: hermes-agent
   runtime: python
   plan: free
   buildCommand: pip install -r requirements.txt
   startCommand: python main.py --port $PORT
   envVars:
     - key: PORT
       value: "10000"
     - key: GITHUB_TOKEN
       sync: false
     - key: OPENAI_API_KEY
       sync: false
