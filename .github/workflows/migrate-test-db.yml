name: Migrate TiDB Test Database

on:
  workflow_dispatch:
  push:
    branches:
      - feature/CIT-DB-SCHEMA-ALIGN-001
    paths:
      - .github/workflows/migrate-test-db.yml

permissions:
  contents: read

concurrency:
  group: cit-tidb-test-migration
  cancel-in-progress: false

jobs:
  migrate-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.TIDB_TEST_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify test database target
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret TIDB_TEST_DATABASE_URL"
            exit 1
          fi
          node <<'NODE'
          const url = new URL(process.env.DATABASE_URL);
          const database = decodeURIComponent(url.pathname.split("/").filter(Boolean).join("/"));
          if (database !== "come_in_it_test") {
            console.error("Blocked: DATABASE_URL must target come_in_it_test. No migration was run.");
            process.exit(1);
          }
          console.log("Target verified: come_in_it_test");
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply committed Drizzle migrations
        run: pnpm exec drizzle-kit migrate
