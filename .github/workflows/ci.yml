name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/come_in_it_test
      JWT_SECRET: ci-only-secret
      OWNER_OPEN_ID: ci-owner
      VITE_ANALYTICS_ENDPOINT: ""
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: come_in_it_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (SCA)
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]+PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}' -- . ':(exclude)API_SECURITY_AUDIT_2026-11-14.md'; then
            echo "Potential credential material was found in tracked files"
            exit 1
          fi

      - name: Apply database schema
        run: |
          set -o pipefail
          pnpm exec drizzle-kit push --force 2>&1 | tee drizzle-push.log
          if grep -Eq '(^|[[:space:]])Error:|ER_[A-Z_]+' drizzle-push.log; then
            echo "Drizzle reported a database schema error"
            exit 1
          fi

      - name: TypeScript check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Production build
        run: pnpm build
